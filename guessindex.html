<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guessing Game</title>
  <link rel="stylesheet" href="styleguess.css">
</head>
<body>
  <main class="app-shell">
    <section class="game-card">
      <div class="game-header">
        <p class="eyebrow">Timed Trivia Challenge</p>
        <h1>Guessing Game</h1>
        <p class="subtitle">
          Pick a difficulty, read the clue, and answer before time runs out.
        </p>
      </div>

      <section id="menuScreen" class="screen active">
        <div class="menu-grid">
          <button class="mode-card" data-mode="easy" type="button">
            <span class="mode-name">Easy</span>
            <span class="mode-meta">10 questions | 12 seconds</span>
          </button>
          <button class="mode-card" data-mode="medium" type="button">
            <span class="mode-name">Medium</span>
            <span class="mode-meta">10 questions | 8 seconds</span>
          </button>
          <button class="mode-card" data-mode="hard" type="button">
            <span class="mode-name">Hard</span>
            <span class="mode-meta">10 questions | 5 seconds</span>
          </button>
          <button id="bonusModeCard" class="mode-card bonus-card" data-mode="bonus" type="button" hidden>
            <span class="mode-name">Bonus Round</span>
            <span class="mode-meta">10 questions | 5 seconds</span>
          </button>
        </div>
      </section>

      <section id="gameScreen" class="screen">
        <div class="status-bar">
          <div class="status-pill">
            <span>Mode</span>
            <strong id="modeLabel">Easy</strong>
          </div>
          <div class="status-pill">
            <span>Question</span>
            <strong id="questionCounter">1 / 10</strong>
          </div>
          <div class="status-pill">
            <span>Score</span>
            <strong id="scoreValue">0</strong>
          </div>
          <div class="status-pill timer-pill">
            <span>Timer</span>
            <strong id="timerValue">5</strong>
          </div>
        </div>

        <div class="prompt-panel">
          <p id="phaseLabel" class="phase-label">Memorize the question...</p>
          <h2 id="questionText">Question text goes here.</h2>
          <p id="feedbackText" class="feedback-text"></p>
        </div>

        <div id="choicesContainer" class="choices-grid"></div>

        <div class="controls">
          <button id="nextButton" class="action-button" type="button" hidden>Next Question</button>
          <button id="menuButton" class="ghost-button" type="button">Back to Menu</button>
        </div>
      </section>

      <section id="resultScreen" class="screen">
        <div class="result-panel">
          <p class="eyebrow">Challenge Complete</p>
          <h2 id="resultTitle">Great effort!</h2>
          <p id="resultSummary" class="result-summary"></p>
          <div class="controls centered">
            <button id="playAgainButton" class="action-button" type="button">Play Again</button>
            <button id="resultMenuButton" class="ghost-button" type="button">Choose Another Mode</button>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="guessjs.js"></script>
</body>
</html>
